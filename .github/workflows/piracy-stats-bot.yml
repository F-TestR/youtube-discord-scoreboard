# PIRACY stats bot: collects the numbers every 3 hours and keeps Discord up to date.
# Also runs straight away when someone edits piracy-bot/manual/ or piracy-bot/config.json,
# or when you press "Run workflow" on the Actions tab. (Use that button, not "Re-run" on an
# old run: a re-run uses the files as they were back then.)
name: PIRACY stats bot (V1, retired)

# Retired: V2 (stats/, workflow "PIRACY stats V2") now runs every hour and has taken over
# the Discord scoreboard. To roll back, put these lines back under "on:" and set
# "live": false in stats/config.json:
#   schedule:
#     - cron: "17 */3 * * *"
on:
  workflow_dispatch:

permissions:
  contents: write   # the bot saves its memory in piracy-bot/data

concurrency:
  group: piracy-stats-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Run the bot
        env:
          DISCORD_STATS_WEBHOOK: ${{ secrets.DISCORD_STATS_WEBHOOK }}
          DISCORD_TABS_WEBHOOK: ${{ secrets.DISCORD_TABS_WEBHOOK }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -n "$GH_SECRETS_PAT" ]; then export IG_TOKEN_OUT="$RUNNER_TEMP/ig_token"; fi
          python3 piracy-bot/bot.py

      - name: Store a renewed Instagram token
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -f "$RUNNER_TEMP/ig_token" ]; then
            gh secret set INSTAGRAM_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
            rm -f "$RUNNER_TEMP/ig_token"
          fi

      - name: Save the bot's memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add piracy-bot/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Stats bot update [skip ci]"
          # if the repo changed meanwhile, keep this run's numbers and try again
          for attempt in 1 2 3; do
            if git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Couldn't save the bot's memory to the repo."
          exit 1
