# Checks the V2 bot whenever its code changes (offline: a pretend internet, nothing is sent).
name: PIRACY stats V2 tests

on:
  push:
    paths: ["stats/piracy/**", "stats/run.py", "stats/connect.py", "stats/tests/**", "stats/site/**",
            ".github/workflows/piracy-stats-v2*.yml"]
  pull_request:
    paths: ["stats/piracy/**", "stats/run.py", "stats/tests/**", "stats/site/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stats/requirements.txt
      - run: pip install -q -r stats/requirements.txt
      - run: python -m unittest discover -s stats/tests -v
